[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/el"
  to = "/index.el.html"
  status = 200

[[redirects]]
  from = "/cv"
  to = "/assets/docs/Alexandros-Tsolakos-Profile.pdf"
  status = 302
